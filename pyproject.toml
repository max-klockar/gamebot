[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebot"
version = "0.1.0"
description = "Projected tabletop game machine runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "NOTICE"]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  # Used by TableLayout.square_center (chess.Square). Keep until geometry is game-agnostic.
  "python-chess>=1.999",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# LED strip / GPIO only — enough for --led-demo (no apt build deps).
pi-led = ["RPi.GPIO>=0.7", "rpi-ws281x>=5.0"]
# Camera stack: needs `sudo apt install libcap-dev` (and usually works better via
# apt `python3-picamera2` + venv --system-site-packages than pure pip).
pi = ["gamebot[pi-led]", "picamera2>=0.3", "pygame>=2.5"]

[project.scripts]
gamebot = "gamebot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
